title: CreateMessage
type: object
properties:
  data:
    type: object
    properties:
      type:
        $ref: ../enums/EnumMessage.yaml
      attributes:
        type: object
        required:
          - routingPlanId
          - messageReference
          - recipient
        properties:
          routingPlanId:
            type: string
            format: uuid
            description: |-
              This is the routing plan you wish your message to be sent with. The values available to you for this are setup during your [onboarding process](#overview--onboarding).

              There are also some global routingPlanIds available, please see the [Free-text communications documentation](#section/Free-text-communications).

              If you send through an invalid routing plan id you will receive a 404 response.
            example: b838b13c-f98c-4def-93f0-515d4e4f4ee1
          messageReference:
            type: string
            description: |-
              This is a client-supplied unique reference for this message.

              This value is used internally to de-duplicate messages. If you send the same value through multiple times only one of the requests will be actioned.
            example: da0b1495-c7cb-468c-9d81-07dee089d728
          billingReference:
            $ref: ../../snippets/BillingReferenceSnippet.yaml
          recipient:
            $ref: ../components/Recipient.yaml
          originator:
            $ref: ../components/Originator.yaml
          personalisation:
            type: object
            description: "The personalisation keys and values for this message. These are linked to the routingPlanId provided and are agreed upon during [onboarding](#overview--onboarding)."
          answerOptions:
            type: object
            optional: true
            description: |-
              The answer options for this message. These are channel specific.

              If you provide answer options, then they will be presented to the receipient for reply options. These will then be sent back via the two-way messaging callback mechanism.

              This feature needs to be enabled on your account and is subject to the relevant callback integration being completed.
              properties:
                type:
                  $ref: ../enums/EnumAnswerOptionsType.yaml
                options:
                  type: array
                  items:
                    type: object
                    properties:
                      code:
                        description: |-
                          This is the code that will be sent back to you in the callback when a recipient selects this option. It is for your reference to understand which option the recipient has selected. It is also the display value shown to the recipient.
                        type: string
                        example: Yes
    required:
      - type
      - attributes
required:
  - data

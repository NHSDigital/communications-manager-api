summary: Returned mail
description: |-
  The returned mail callback sends a POST request to your service when NHS Notify is notified that a letter is returned.

  If you're onboarding with NHS Notify and need to use the returned mail callback, contact the onboarding team to tell them you want to subscribe to returned mail events.

  If you're live with NHS Notify and need to use the returned mail callback, [raise a Service Now ticket](https://nhsdigitallive.service-now.com/csm).

  ### About returned mail

  When NHS Notify is notified that a letter is returned, it sends a callback to your service with the details of the return.

  The callback includes the return reason code and text, the message it relates to, and the time the callback event was processed.

  Callbacks can arrive more than once or out of order. Use `meta.idempotencyKey` to identify duplicate events. See the callback guidance above for retries and rate limiting.

  ### Authentication

  This callback uses mutual TLS (mTLS) for authentication instead of HMAC signatures or API keys. NHS Notify presents a client certificate when connecting to your endpoint. Your service must validate the inbound client certificate against the NHS Notify CA to authenticate the request.
operationId: post-v1-returned-mail-callbacks
security: []
requestBody:
  content:
    application/vnd.api+json:
      schema:
        type: object
        required:
          - data
        properties:
          data:
            type: array
            minItems: 1
            items:
              $ref: ../schemas/components/ReturnedMailCallback.yaml
responses:
    '202':
        description: Accepted
    '401':
        description: Unauthorized
    '403':
        description: Forbidden
    '429':
        $ref: ../responses/4xx/callbacks/429_TooManyRequests_Callbacks.yaml

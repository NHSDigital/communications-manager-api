name: "$(SourceBranchName)+$(BuildID)"

trigger: none
pr: none

resources:
  repositories:
    - repository: common
      type: github
      name: NHSDigital/api-management-utils
      ref: refs/heads/edge
      endpoint: NHSDigital
  pipelines:
  - pipeline: build_pipeline
    source: "Communications-Manager-Build"
    trigger:
      branches:
        exclude:
          - master
          - release
          - hotfix
          - refs/heads/master
          - refs/heads/release
          - refs/heads/hotfix
          - refs/tags/v*

pool:
  name: 'AWS-ECS'

variables:
  - template: project.yml

extends:
  # HACK (not for merging): apigee-deployment.yml picks pr.yml or release.yml from the
  # pipeline definition name, and pr.yml rejects 'ref'. Extend deploy-stages.yml directly
  # with release.yml, supplying everything apigee-deployment.yml would normally expand.
  template: azure/common/deploy-stages.yml@common
  parameters:
    deploy_template: release.yml
    deploy_review_sandbox: false
    spec_file: DEPRECATED
    portal_api_requires_callback_url: DEPRECATED
    ping: true
    prod_requires_approval: true
    prod_producer_approval: false
    manual_approval_env: manual-approval
    python_version: '3.13'
    agent_pool: AWS-ECS
    apigee_deployments:
      - environment: ref
        stage_name: ref
        depends_on: []
        service_name: ${{ variables.service_name }}
        short_service_name: ${{ variables.short_service_name }}
        service_base_path: ${{ variables.service_base_path }}
        hosted_target_connection_path_suffix: ${{ variables.hosted_target_connection_path_suffix }}
        hosted_target_healthcheck_suffix: /_status
        product_display_name: DEPRECATED
        product_description: DEPRECATED
        make_spec_visible: DEPRECATED
        fully_qualified_service_name: ''
        proxy_path: live
        enable_monitoring: false
        enable_status_monitoring: false
        secret_file_ids: []
        secret_ids: []
        config_ids: []
        pre_template: []
        post_template: []
        pre_deploy: []
        jinja_templates:
          ENVIRONMENT_TYPE: 'internal'
          ERROR_ABOUT_LINK: ${{ variables.error_about_link }}
          APP_RESPONSE_TARGET_SERVER: 'communications-manager-target'
        post_deploy:
          - template: azure/templates/run-tests.yml@self
            parameters:
              environment: 'ref'
              test_command: 'make internal-dev-test'
